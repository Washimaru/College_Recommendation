[project]
name = "faculty-pipeline"
version = "0.1.0"
description = "UniMatch faculty directory crawl + extraction pipeline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "click>=8.1",
    "pyyaml>=6.0",
    "anthropic>=0.34",
    "python-dotenv>=1.0",
    "tldextract>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Headless-browser fallback for JS-rendered directories (§6 Stage 3, opt-in
# via --dynamic). Not used by Milestones 0-1.
dynamic = ["playwright>=1.44"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["faculty_pipeline*"]
